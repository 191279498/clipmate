<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 渐变定义 -->
  <defs>
    <!-- 主背景渐变 - 使用橙色系 -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9F1C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8A00;stop-opacity:1" />
    </linearGradient>
    
    <!-- 纸张渐变 - 轻微的白色渐变 -->
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 - 轻微的阴影效果 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <!-- 高光效果滤镜 -->
    <filter id="highlight" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景圆形 - Notion风格通常使用柔和的圆角 -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#primaryGradient)"/>
  
  <!-- 主体纸张 - 轻微拟物风格 -->
  <rect x="24" y="24" width="80" height="80" rx="8" ry="8" fill="url(#paperGradient)" filter="url(#shadow)"/>
  
  <!-- 纸张顶部装饰条 - Notion风格特征 -->
  <rect x="24" y="24" width="80" height="6" rx="4" ry="4" fill="#FFE4C4"/>
  
  <!-- 内容行 - 模拟信息提取的结构化内容 -->
  <rect x="32" y="40" width="64" height="2" rx="1" fill="#E0E0E0"/>
  <rect x="32" y="48" width="72" height="2" rx="1" fill="#E0E0E0"/>
  <rect x="32" y="56" width="60" height="2" rx="1" fill="#E0E0E0"/>
  <rect x="32" y="64" width="72" height="2" rx="1" fill="#E0E0E0"/>
  <rect x="32" y="72" width="56" height="2" rx="1" fill="#E0E0E0"/>
  
  <!-- 信息提取箭头 - 体现功能特征 -->
  <g transform="translate(84, 60)" filter="url(#highlight)">
    <!-- 箭头主体 -->
    <path d="M-8 0 L4 0 L-2 -8 Z" fill="#FF9F1C"/>
    <!-- 数据点 -->
    <circle cx="-2" cy="0" r="2.5" fill="#FF9F1C"/>
    <!-- 数据流动效果 -->
    <circle cx="4" cy="0" r="1.5" fill="#FF9F1C" opacity="0.7"/>
    <circle cx="8" cy="0" r="1" fill="#FF9F1C" opacity="0.5"/>
  </g>
  
  <!-- 顶部高光效果 - 增强拟物感 -->
  <rect x="28" y="30" width="4" height="2" rx="1" fill="#FFFFFF" opacity="0.8"/>
  <rect x="36" y="30" width="3" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="44" y="30" width="2" height="2" rx="1" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- 右下角装饰元素 - 轻微的数据流动效果 -->
  <g transform="translate(88, 86)">
    <circle cx="0" cy="0" r="1.5" fill="#FF9F1C" opacity="0.8"/>
    <circle cx="4" cy="-4" r="1.5" fill="#FF9F1C" opacity="0.6"/>
    <circle cx="8" cy="-8" r="1.5" fill="#FF9F1C" opacity="0.4"/>
  </g>
  
  <!-- 左下角小装饰 - 保持简约风格 -->
  <rect x="32" y="82" width="8" height="1" rx="0.5" fill="#FF9F1C" opacity="0.5"/>
  <rect x="32" y="86" width="5" height="1" rx="0.5" fill="#FF9F1C" opacity="0.3"/>
</svg>